name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        run: forge install foundry-rs/forge-std@v1.16.2 --no-git
      - name: Install OpenZeppelin
        run: forge install OpenZeppelin/openzeppelin-contracts@v5.3.0 --no-git
      - name: Build
        run: forge build
      - name: Test
        run: forge test
      # Gas regression guard — regenerate with `forge snapshot` when intended.
      - name: Gas snapshot check
        run: forge snapshot --check --tolerance 1 --no-match-test "invariant_|Fuzz|fuzz"
      # Pip slither (latest crytic-compile) — the docker action's bundled
      # crytic-compile cannot parse current Foundry build-info output.
      - name: Install Slither
        run: pipx install slither-analyzer==0.11.4
      - name: Slither
        run: slither . --fail-high --filter-paths "lib/"

  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install contract deps
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std@v1.16.2 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.3.0 --no-git
          forge build
      # No version input: pnpm/action-setup reads the packageManager field,
      # and specifying both (when they differ) is an error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @lacrew/core sync-abis
      - run: pnpm build
      - run: pnpm lint
      # Before the suite, because it is the fastest thing here and it is the one
      # check that decays without enforcement: a repo nobody verifies drifts out
      # of style, and then `pnpm format` rewrites files a contributor never
      # touched and buries their diff.
      - run: pnpm format:check
      - run: pnpm test

  # Flow & blueprint regression scenarios (PRD F2.29). Deliberately not path
  # filtered: a skipped job never reports, so a required check that only runs on
  # some paths is a check that silently passes on the rest. The suite is offline
  # and takes seconds, so running it everywhere is cheaper than getting the
  # filter wrong — an edit to a connector preset, an interpolator, or the engine
  # can all let a merge escape policy.
  evals:
    name: Evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      # No network: the harness blocks fetch for the duration of every run, so
      # a scenario that reaches api.github.com fails with the URL it tried.
      - run: pnpm --filter @lacrew/flows eval

  # The persisted stores, against the database they actually run on (F2.25).
  #
  # Every store test here is gated on DATABASE_URL and skips without one, so the
  # Packages job above proves the memory fallbacks and nothing else. That is a
  # real gap: the memory store holds each record object whole, so a column the
  # row mapping forgets to write round-trips there no matter what — which is how
  # a message's `blocks` shipped writing and reading as undefined while every
  # conversation test passed. This job is the pass that would have caught it.
  stores:
    name: Stores (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lacrew
          POSTGRES_PASSWORD: lacrew
          POSTGRES_DB: lacrew
        ports:
          - 5432:5432
        # Without this the first query races the server's own startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://lacrew:lacrew@127.0.0.1:5432/lacrew
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      # No Foundry here: `sync-abis` falls back to the committed `src/abis.ts`
      # when there are no forge artifacts, and nothing in this job touches a
      # contract. The Contracts job is where ABI drift is caught.
      - run: pnpm build
      # The schema first: a store test against an unmigrated database fails with
      # a bare "relation does not exist", which reads like a code bug.
      - run: pnpm --filter @lacrew/db db:migrate
      - name: Store round-trips
        run: >-
          pnpm --filter @lacrew/orchestrator exec node --import tsx --test
          src/crewBindings.test.ts src/auditStore.test.ts src/runtimeStore.test.ts
