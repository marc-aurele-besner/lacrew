name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git
      - name: Install OpenZeppelin
        run: forge install OpenZeppelin/openzeppelin-contracts@v5.3.0 --no-git
      - name: Build
        run: forge build
      - name: Test
        run: forge test
      # Gas regression guard — regenerate with `forge snapshot` when intended.
      - name: Gas snapshot check
        run: forge snapshot --check --tolerance 1 --no-match-test "invariant_|Fuzz|fuzz"
      # Pip slither (latest crytic-compile) — the docker action's bundled
      # crytic-compile cannot parse current Foundry build-info output.
      - name: Install Slither
        run: pipx install slither-analyzer
      - name: Slither
        run: slither . --fail-high --filter-paths "lib/"

  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install contract deps
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.3.0 --no-git
          forge build
      # No version input: pnpm/action-setup reads the packageManager field,
      # and specifying both (when they differ) is an error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @lacrew/core sync-abis
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test

  # Flow & blueprint regression scenarios (PRD F2.29). Deliberately not path
  # filtered: a skipped job never reports, so a required check that only runs on
  # some paths is a check that silently passes on the rest. The suite is offline
  # and takes seconds, so running it everywhere is cheaper than getting the
  # filter wrong — an edit to a connector preset, an interpolator, or the engine
  # can all let a merge escape policy.
  evals:
    name: Evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      # No network: the harness blocks fetch for the duration of every run, so
      # a scenario that reaches api.github.com fails with the URL it tried.
      - run: pnpm --filter @lacrew/flows eval
