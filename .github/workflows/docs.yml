name: Docs

# Publishes apps/docs to GitHub Pages → docs.lacrew.xyz (PRD F1.14 / F0.11).
# Pull requests build only; deploys happen on main.
on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "SPEC.md"
      - "packages/sdk/**"
      - "packages/flows/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "SPEC.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Read-only by default; the deploy job alone gets the Pages/OIDC grants, so the
# PR-triggered build never runs with a token that could publish.
permissions:
  contents: read

# Never cancel an in-flight deploy; queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      # TypeDoc resolves the SDK's own types, so its build must run first.
      - run: pnpm --filter @lacrew/docs... build
      - name: Verify the spec, the API reference, and the search index shipped
        run: |
          test -f apps/docs/out/spec/index.html
          test -f apps/docs/out/reference/sdk/index.html
          test -f apps/docs/out/reference/flows/index.html
          test -f apps/docs/out/.nojekyll
          grep -q IPolicyModule apps/docs/out/api/search
          grep -q plan-required apps/docs/out/api/search
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/out

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The Pages site must already exist — GITHUB_TOKEN lacks the admin scope to
      # create it (enablement fails with "Resource not accessible by integration").
      # One-time setup: gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
